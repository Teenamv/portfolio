<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="160" height="180" role="img" aria-label="Tia, the studio robot">
  <defs>
    <linearGradient id="visor" x1="48" y1="28" x2="112" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2460" />
      <stop offset="1" stop-color="#16112f" />
    </linearGradient>
    <linearGradient id="shell" x1="36" y1="12" x2="124" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d9d3f5" />
    </linearGradient>
    <linearGradient id="body" x1="40" y1="98" x2="120" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#413a7a" />
      <stop offset="1" stop-color="#241e4a" />
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2dcff" />
      <stop offset="1" stop-color="#8f7dff" />
    </linearGradient>
  </defs>

  <!-- antenna -->
  <path d="M80 16V8" stroke="#b9b0f5" stroke-width="4" stroke-linecap="round" />
  <circle cx="80" cy="6" r="4.5" fill="#c9c1ff" />

  <!-- legs + boots -->
  <rect x="56" y="142" width="18" height="14" rx="6" fill="#413a7a" />
  <rect x="86" y="142" width="18" height="14" rx="6" fill="#413a7a" />
  <rect x="50" y="152" width="30" height="14" rx="7" fill="#ece9ff" />
  <rect x="80" y="152" width="30" height="14" rx="7" fill="#ece9ff" />
  <rect x="50" y="152" width="30" height="6" rx="3" fill="#ffffff" opacity="0.6" />
  <rect x="80" y="152" width="30" height="6" rx="3" fill="#ffffff" opacity="0.6" />

  <!-- arms -->
  <rect x="18" y="104" width="18" height="32" rx="9" fill="#413a7a" />
  <rect x="124" y="104" width="18" height="32" rx="9" fill="#413a7a" />
  <circle cx="27" cy="138" r="10" fill="#ece9ff" />
  <circle cx="133" cy="138" r="10" fill="#ece9ff" />

  <!-- body -->
  <rect x="40" y="96" width="80" height="58" rx="24" fill="url(#body)" />
  <rect x="64" y="108" width="32" height="26" rx="11" fill="#ece9ff" />
  <circle cx="80" cy="121" r="5" fill="#7c6efa" />

  <!-- neck -->
  <rect x="66" y="88" width="28" height="14" rx="5" fill="#3b3475" />

  <!-- ear pods -->
  <circle cx="24" cy="58" r="15" fill="#7c6efa" />
  <circle cx="24" cy="58" r="7" fill="#d6cfff" />
  <circle cx="136" cy="58" r="15" fill="#7c6efa" />
  <circle cx="136" cy="58" r="7" fill="#d6cfff" />

  <!-- helmet -->
  <rect x="36" y="10" width="88" height="90" rx="32" fill="url(#shell)" />
  <path d="M80 14v12" stroke="#cbc4ea" stroke-width="3" stroke-linecap="round" />

  <!-- visor -->
  <rect x="48" y="26" width="64" height="58" rx="23" fill="url(#visor)" />

  <!-- eyes -->
  <rect x="61" y="42" width="15" height="26" rx="7.5" fill="url(#eye)" />
  <rect x="85" y="42" width="15" height="26" rx="7.5" fill="url(#eye)" />
  <rect x="64" y="46" width="5" height="9" rx="2.5" fill="#ffffff" opacity="0.85" />
  <rect x="88" y="46" width="5" height="9" rx="2.5" fill="#ffffff" opacity="0.85" />

  <!-- mouth -->
  <rect x="73" y="73" width="14" height="3" rx="1.5" fill="#6f61d8" opacity="0.75" />
</svg>
